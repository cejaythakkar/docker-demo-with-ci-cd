deploy:
  needs: build-and-push
  runs-on: ubuntu-latest
  steps:
    - name: Deploy to Azure Server via Docker Compose
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Navigate to the user's home directory
          cd /home/${{ secrets.SERVER_USER }}

          # 2. Check if the project folder exists. If not, clone it. If yes, pull the latest code.
          if [ ! -d "mern-app" ]; then
            echo "Repository not found on server. Cloning for the first time..."
            # Replaces with your public repo URL or uses token authentication if private
            git clone https://github.com{{ github.repository }}.git mern-app
            cd mern-app
          else
            echo "Repository found. Fetching and pulling latest code..."
            cd mern-app
            git fetch --all
            git reset --hard origin/main
          fi

          # 3. Authenticate with Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          # 4. Modify your docker-compose.yml dynamically to use the Docker Hub images
          # This safely updates the image lines without breaking local configurations or volumes
          sed -i 's|image: .*mern-app-server.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:latest|g' docker-compose.yml
          sed -i 's|image: .*mern-app-client.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:latest|g' docker-compose.yml

          # 5. Pull down the fresh production images built by GitHub Actions
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose pull

          # 6. Boot up the full stack in the background
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose up -d --remove-orphans
