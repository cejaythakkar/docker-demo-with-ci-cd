name: Build and Deploy MERN Stack via Compose

on:
  push:
    branches:
      - main

jobs:
  # JOB 1: THIS PUSHES IMAGES TO DOCKER HUB 🚀
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:${{ github.sha }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:${{ github.sha }}

  # JOB 2: THIS RUNS ON YOUR SERVER TO PULL & RUN 🖥️
  deploy:
    needs: build-and-push # Waits for Job 1 to finish pushing images first
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure Server via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}

            if [ ! -d "mern-app" ]; then
              echo "Repository not found on server. Cloning..."
              git clone https://github.com{{ github.repository }}.git mern-app
              cd mern-app
            else
              echo "Repository found. Pulling latest code..."
              cd mern-app
              git fetch --all
              git reset --hard origin/main
            fi

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            sed -i 's|image: .*mern-app-server.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:latest|g' docker-compose.yml
            sed -i 's|image: .*mern-app-client.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:latest|g' docker-compose.yml

            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose pull
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose up -d --remove-orphans
