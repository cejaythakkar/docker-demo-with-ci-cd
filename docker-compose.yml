version: "3.8"

services:
  server:
    # Pulls the image built by GitHub Actions
    image: ${DOCKERHUB_USERNAME}/mern-app-server:latest
    environment:
      - PORT=${SERVER_PORT}
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

  client:
    # Pulls the image built by GitHub Actions
    image: ${DOCKERHUB_USERNAME}/mern-app-client:latest
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
    driver: local
