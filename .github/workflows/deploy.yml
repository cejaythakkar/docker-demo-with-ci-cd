name: Build and Deploy MERN Stack via Compose

on:
  push:
    branches:
      - main

jobs:
  # JOB 1: BUILD AND PUSH TARGET COMPONENT IMAGES
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. BUILD & PUSH CLIENT
      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:${{ github.sha }}

      # 2. BUILD & PUSH SERVER
      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:${{ github.sha }}

  # JOB 2: REMOTE AZURE SERVER DELIVERY PULL AND RESTART
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure Server via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Switch workspace directory
            cd /home/${{ secrets.SERVER_USER }}

            # 2. Clone or pull down structural config updates matching code changes
            if [ ! -d "docker-demo-with-ci-cd" ]; then
              echo "Repository structure missing. Running direct clean clone..."
              git clone https://github.com/cejaythakkar/docker-demo-with-ci-cd.git
              cd docker-demo-with-ci-cd
            else
              echo "Repository located. Synchronizing with latest main remote tree updates..."
              cd docker-demo-with-ci-cd
              git fetch --all
              git reset --hard origin/main
            fi

            # 3. Authenticate host daemon session
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 4. Modify compose pointers inline to target the custom build registries
            sed -i 's|image: .*mern-app-server.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:latest|g' docker-compose.yml
            sed -i 's|image: .*mern-app-client.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:latest|g' docker-compose.yml

            # 5. Fetch structural images over network
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose pull

            # 6. Apply state adjustments immediately drops out target nodes
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} docker compose up -d --remove-orphans
