name: Build and Deploy MERN Stack to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. BUILD & PUSH CLIENT IMAGE
      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client # Points directly to your client folder containing its Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:${{ github.sha }}

      # 2. BUILD & PUSH SERVER IMAGE
      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server # Points directly to your server folder containing its Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Login to Docker Hub on the Azure VM
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull down both updated images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:latest

            # Clean up old container instances safely (both client and server)
            docker stop mern-client-container mern-server-container || true
            docker rm mern-client-container mern-server-container || true

            # 1. Spin up the Node/Express backend Server (Mapped to port 5000)
            docker run -d --name mern-server-container -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:latest

            # 2. Spin up the Frontend Client (Mapped to port 80)
            docker run -d --name mern-client-container -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:latest
