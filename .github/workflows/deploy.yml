name: Build and Deploy MERN Stack via Compose

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. BUILD & PUSH CLIENT (With Build Args injected)
      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-client:${{ github.sha }}

      # 2. BUILD & PUSH SERVER
      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-app-server:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure Server via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the folder where your project repository lives on the server
            # (Change /home/azureuser/app to your actual project path)
            cd /home/azureuser/app

            # Pull down the latest changes to your docker-compose.yml file if needed
            git pull origin main || true

            # Authenticate with Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull down the updated images specified in docker-compose.yml
            docker compose pull

            # Recreate containers safely, dropping dead instances and running in the background
            docker compose up -d --remove-orphans
